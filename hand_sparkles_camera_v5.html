<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hand Sparkles Camera</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #080b12;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .app {
      width: min(100vw, 1280px);
      padding: 16px;
    }

    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(0,0,0,.5);
    }

    video, canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    video {
      background: #000;
    }

    canvas {
      pointer-events: none;
    }

    .hud {
      position: absolute;
      left: 16px;
      top: 16px;
      z-index: 10;
      display: flex;
      gap: 8px;
      align-items: center;
      transform: none;
    }

    button, select {
      appearance: none;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(12,16,28,.78);
      color: #fff;
      border-radius: 999px;
      padding: 10px 14px;
      backdrop-filter: blur(10px);
      font-size: 14px;
    }

    button {
      cursor: pointer;
      font-weight: 700;
    }

    button:hover {
      background: rgba(30,38,60,.9);
    }

    .status {
      position: absolute;
      right: 16px;
      top: 16px;
      z-index: 10;
      background: rgba(12,16,28,.65);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 13px;
      backdrop-filter: blur(10px);
      transform: none;
    }

    .help {
      margin-top: 10px;
      text-align: center;
      color: #aeb7c8;
      font-size: 13px;
    }

    @media (max-width: 700px) {
      .hud {
        right: 12px;
        left: 12px;
        flex-wrap: wrap;
      }
      .stage {
        border-radius: 12px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="stage">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas"></canvas>

      <div class="hud">
        <button id="startBtn">カメラ開始</button>
        <select id="cameraSelect" title="カメラ"></select>
      </div>

      <div class="status" id="status">待機中</div>
    </div>

    <div class="help">
      手をカメラに映すと、その周囲に星がキラキラ表示されます。
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const startBtn = document.getElementById("startBtn");
    const cameraSelect = document.getElementById("cameraSelect");
    const statusEl = document.getElementById("status");

    let stream = null;
    let running = false;
    let processing = false;
    let lastHandData = [];
    let particles = [];

    const STAR_COUNT_PER_HAND = 60;
    const MAX_PARTICLES = 500;

    let previousHandCenters = [];
    let handVelocities = [];
    let previousHandSpeeds = [];
    let handBurstCooldowns = [];

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);

      canvas.width = Math.round(rect.width * dpr);
      canvas.height = Math.round(rect.height * dpr);

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    window.addEventListener("resize", resizeCanvas);

    async function listCameras() {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const cameras = devices.filter(d => d.kind === "videoinput");

      cameraSelect.innerHTML = "";

      cameras.forEach((cam, i) => {
        const option = document.createElement("option");
        option.value = cam.deviceId;
        option.textContent = cam.label || `カメラ ${i + 1}`;
        cameraSelect.appendChild(option);
      });

      return cameras;
    }

    async function startCamera(deviceId = null) {
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
      }

      const constraints = {
        audio: false,
        video: {
          width: { ideal: 1280 },
          height: { ideal: 720 },
          frameRate: { ideal: 30, max: 60 }
        }
      };

      if (deviceId) {
        constraints.video.deviceId = { exact: deviceId };
      }

      stream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = stream;

      await video.play();
      await listCameras();

      const activeTrack = stream.getVideoTracks()[0];
      const settings = activeTrack.getSettings();

      if (settings.deviceId) {
        cameraSelect.value = settings.deviceId;
      }

      running = true;
      startBtn.textContent = "カメラ再開";
      statusEl.textContent = "手を探しています…";

      resizeCanvas();
      requestAnimationFrame(detectLoop);
      requestAnimationFrame(drawLoop);
    }

    cameraSelect.addEventListener("change", async () => {
      try {
        await startCamera(cameraSelect.value);
      } catch (err) {
        console.error(err);
        statusEl.textContent = "カメラ切替に失敗";
      }
    });

    startBtn.addEventListener("click", async () => {
      try {
        await startCamera(cameraSelect.value || null);
      } catch (err) {
        console.error(err);
        statusEl.textContent = "カメラを開始できません";
        alert(
          "カメラを開始できませんでした。\n\n" +
          "Chrome等で localhost または HTTPS から開いてください。\n" +
          "また、ブラウザのカメラ権限を許可してください。"
        );
      }
    });

    const hands = new Hands({
      locateFile: file =>
        `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.65,
      minTrackingConfidence: 0.6
    });

    hands.onResults(results => {
      if (!results.multiHandLandmarks) {
        lastHandData = [];
        statusEl.textContent = "手を探しています…";
        return;
      }

      const now = performance.now();

      lastHandData = results.multiHandLandmarks.map((landmarks, handIndex) => {
        let minX = 1;
        let minY = 1;
        let maxX = 0;
        let maxY = 0;

        for (const p of landmarks) {
          minX = Math.min(minX, p.x);
          minY = Math.min(minY, p.y);
          maxX = Math.max(maxX, p.x);
          maxY = Math.max(maxY, p.y);
        }

        const center = landmarks[9] || {
          x: (minX + maxX) / 2,
          y: (minY + maxY) / 2
        };

        const prev = previousHandCenters[handIndex];
        let vx = 0;
        let vy = 0;

        if (prev) {
          const dt = Math.max(8, now - prev.time);
          vx = (center.x - prev.x) / dt;
          vy = (center.y - prev.y) / dt;
        }

        previousHandCenters[handIndex] = {
          x: center.x,
          y: center.y,
          time: now
        };

        handVelocities[handIndex] = { vx, vy };

        return {
          landmarks,
          minX,
          minY,
          maxX,
          maxY,
          center,
          velocity: { vx, vy }
        };
      });

      previousHandCenters.length = lastHandData.length;
      handVelocities.length = lastHandData.length;

      statusEl.textContent = `${lastHandData.length} hand`;
    });

    async function detectLoop() {
      if (!running) return;

      if (
        !processing &&
        video.readyState >= 2 &&
        video.videoWidth > 0
      ) {
        processing = true;

        try {
          await hands.send({ image: video });
        } catch (err) {
          console.error(err);
        }

        processing = false;
      }

      requestAnimationFrame(detectLoop);
    }

    class Sparkle {
      constructor(x, y, radius, handVelocity = { vx: 0, vy: 0 }) {
        const angle = Math.random() * Math.PI * 2;
        const distance = radius * (0.65 + Math.random() * 0.85);

        this.x = x + Math.cos(angle) * distance;
        this.y = y + Math.sin(angle) * distance;

        this.baseX = this.x;
        this.baseY = this.y;

        this.size = 5 + Math.random() * 10;
        this.life = 0;
        this.maxLife = 20 + Math.random() * 32;

        // canvas自体を左右反転表示しているので、
        // ランドマーク座標と同じ符号のまま速度を与える。
        const motionX = handVelocity.vx * canvas.clientWidth * 22;
        const motionY = handVelocity.vy * canvas.clientHeight * 22;

        const speed = Math.hypot(motionX, motionY);
        const maxSpeed = 18;
        const scale = speed > maxSpeed ? maxSpeed / speed : 1;

        this.driftX =
          motionX * scale +
          (Math.random() - 0.5) * 2.0;

        this.driftY =
          motionY * scale +
          (Math.random() - 0.5) * 2.0;

        this.spin = Math.random() * Math.PI;
        this.spinSpeed = (Math.random() - 0.5) * 0.16;

        this.twinkleOffset = Math.random() * Math.PI * 2;

        const palette = [
          [255, 255, 255],
          [255, 240, 138],
          [255, 203, 235],
          [169, 226, 255],
          [211, 183, 255]
        ];

        this.color = palette[Math.floor(Math.random() * palette.length)];
      }

      update() {
        this.life++;
        this.x += this.driftX;
        this.y += this.driftY;
        this.spin += this.spinSpeed;
      }

      draw() {
        const t = this.life / this.maxLife;
        const fade = Math.sin(Math.PI * Math.min(1, t));
        const twinkle =
          0.55 +
          0.45 *
          Math.sin(performance.now() * 0.012 + this.twinkleOffset);

        const alpha = Math.max(0, fade * twinkle);
        const size = this.size * (0.75 + twinkle * 0.45);

        const [r, g, b] = this.color;

        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.spin);

        ctx.shadowBlur = 18;
        ctx.shadowColor = `rgba(${r},${g},${b},${alpha})`;
        ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;

        drawFourPointStar(ctx, 0, 0, size, size * 0.22);

        ctx.restore();
      }

      get dead() {
        return this.life >= this.maxLife;
      }
    }

    function drawFourPointStar(ctx, x, y, outer, inner) {
      ctx.beginPath();

      const points = [
        [0, -outer],
        [inner, -inner],
        [outer, 0],
        [inner, inner],
        [0, outer],
        [-inner, inner],
        [-outer, 0],
        [-inner, -inner]
      ];

      ctx.moveTo(x + points[0][0], y + points[0][1]);

      for (let i = 1; i < points.length; i++) {
        ctx.lineTo(x + points[i][0], y + points[i][1]);
      }

      ctx.closePath();
      ctx.fill();
    }

    function addSparklesAroundHands() {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      const now = performance.now();

      for (let handIndex = 0; handIndex < lastHandData.length; handIndex++) {
        const hand = lastHandData[handIndex];

        const cx = hand.center.x * w;
        const cy = hand.center.y * h;

        const handW = (hand.maxX - hand.minX) * w;
        const handH = (hand.maxY - hand.minY) * h;
        const radius = Math.max(55, Math.max(handW, handH) * 0.72);

        const vx = hand.velocity?.vx || 0;
        const vy = hand.velocity?.vy || 0;
        const speed = Math.hypot(vx, vy);

        const previousSpeed = previousHandSpeeds[handIndex] || 0;
        const lastBurst = handBurstCooldowns[handIndex] || 0;

        // 手が止まっていても少しだけキラキラさせる。
        // これで検出できているか目でも確認できる。
        let amount = Math.random() < 0.45 ? 1 : 0;

        // 以前よりかなり緩い閾値。
        // 0.00028 = 100msで画面幅の約2.8%程度移動。
        const burstThreshold = 0.00028;
        const rearmThreshold = 0.00016;
        const burstCooldownMs = 220;

        // 「速さが閾値を越えた瞬間」に大量発生。
        // 高速移動中ずっと大量発生し続けないようにする。
        const crossedThreshold =
          previousSpeed < burstThreshold &&
          speed >= burstThreshold;

        if (
          crossedThreshold &&
          now - lastBurst > burstCooldownMs
        ) {
          const strength = Math.min(
            1,
            Math.max(0, (speed - burstThreshold) / 0.0012)
          );

          amount = 32 + Math.floor(strength * 48);
          handBurstCooldowns[handIndex] = now;
        }

        // 一度速くなった後、十分遅くなれば次の振りに備える。
        if (speed < rearmThreshold) {
          previousHandSpeeds[handIndex] = 0;
        } else {
          previousHandSpeeds[handIndex] = speed;
        }

        for (let i = 0; i < amount; i++) {
          if (particles.length >= MAX_PARTICLES) break;

          const isBurst = amount >= 20;

          const jitteredVelocity = {
            vx: vx + (Math.random() - 0.5) * (isBurst ? 0.00055 : 0.00015),
            vy: vy + (Math.random() - 0.5) * (isBurst ? 0.00055 : 0.00015)
          };

          particles.push(
            new Sparkle(
              cx,
              cy,
              radius,
              jitteredVelocity
            )
          );
        }
      }

      previousHandSpeeds.length = lastHandData.length;
      handBurstCooldowns.length = lastHandData.length;
    }

    function drawHandGlow() {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;

      for (const hand of lastHandData) {
        for (const p of hand.landmarks) {
          const x = p.x * w;
          const y = p.y * h;

          ctx.beginPath();
          ctx.arc(x, y, 1.3, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(255,255,255,.18)";
          ctx.fill();
        }
      }
    }

    function drawLoop() {
      if (!running) return;

      ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);

      addSparklesAroundHands();

      particles.forEach(p => {
        p.update();
        p.draw();
      });

      particles = particles.filter(p => !p.dead);

      drawHandGlow();

      requestAnimationFrame(drawLoop);
    }

    navigator.mediaDevices?.addEventListener?.("devicechange", async () => {
      try {
        await listCameras();
      } catch {}
    });

    if (!navigator.mediaDevices?.getUserMedia) {
      statusEl.textContent = "このブラウザはカメラAPI非対応";
      startBtn.disabled = true;
    }
  </script>
</body>
</html>
